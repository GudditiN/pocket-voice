[project]
name = "pocket-voice"
version = "0.1.0"
description = "Lightweight voice assistant: PocketTTS voice profile + Groq ASR/LLM + psutil/SQLite analytics"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pocket-tts",
    "torch>=2.5",
    "streamlit>=1.40",
    "plotly>=5.20",
    "pandas>=2.0",
    "psutil>=5.9",
    "groq>=0.11",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local ASR fallback (ASR_BACKEND=local). Not installed by default.
local-asr = ["faster-whisper>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
markers = ["slow: needs the real PocketTTS model (run in Codespaces)"]

# CPU-only torch on Linux (Codespaces/Docker): ~200 MB instead of ~2 GB of CUDA wheels.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
